[tools]
go = "1.27.3"
gofumpt = "0.12.0"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"

[tasks.fmt]
description = "Format Go sources with gofumpt, goimports, and gci"
run = "golangci-lint fmt"

[tasks."fmt:check"]
description = "Fail when Go sources need formatting"
run = "golangci-lint fmt --diff"

[tasks.whitespace]
description = "Fail when any file has trailing whitespace"
run = """
if git grep -nIE --untracked '[[:blank:]]+$'; then
  echo 'trailing whitespace found' >&2
  exit 1
fi
"""

[tasks.tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

[tasks."tidy:check"]
description = "Fail when go.mod or go.sum is untidy"
run = "go mod tidy -diff"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run tests with the race detector"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks.build]
description = "Build the extension binary into bin/"
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/kodelet-extension-subagent ./cmd/kodelet-extension-subagent"

[tasks."release:check"]
description = "Validate the GoReleaser configuration"
run = "goreleaser check"

[tasks.snapshot]
description = "Cross-compile unpublished release binaries into dist/"
run = "goreleaser release --snapshot --clean"

[tasks.check]
description = "Run every check required before merging"
depends = ["fmt:check", "whitespace", "tidy:check", "lint", "test", "build", "release:check"]

[tasks.version]
description = "Print the extension version"
run = "cat internal/version/VERSION"

[tasks.release]
description = "Check, tag, and push v<version> from a clean main; CI publishes the release"
run = """
set -eu
tag="v$(cat internal/version/VERSION)"
branch="$(git branch --show-current)"
if [ "$branch" != main ]; then
  echo "release from main, not ${branch:-a detached HEAD}" >&2
  exit 2
fi
if [ -n "$(git status --porcelain)" ]; then
  echo 'worktree must be clean' >&2
  exit 2
fi
remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
if [ -n "$remote_tag" ] || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
  echo "tag $tag already exists; bump internal/version/VERSION first" >&2
  exit 2
fi
mise run check
git tag -a "$tag" -m "$tag"
if ! git push --atomic origin HEAD "refs/tags/$tag"; then
  git tag -d "$tag" >/dev/null
  echo "push failed, so the local tag $tag was removed; fix the cause and rerun" >&2
  exit 1
fi
echo "pushed main and $tag; the release workflow publishes the binaries"
"""

[tasks.clean]
description = "Remove build outputs"
run = "rm -rf bin dist"
