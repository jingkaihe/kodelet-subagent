name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    environment:
      name: pypi
      url: https://pypi.org/p/kodelet-subagent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run -- python --version
      - name: Verify release version
        run: |
          PACKAGE_VERSION="$(make --no-print-directory version)"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - run: make check
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
